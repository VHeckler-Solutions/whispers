<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anzel Music</title>
  <style>
    :root{
      --bg:#07070b;
      --panel:#0f1020;
      --txt:#eaeaf2;
      --muted:#a7a7c0;
      --accent:#7cf7d4;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 50% -10%, #1c1f3a, var(--bg));
      color:var(--txt);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{
      width:min(980px, 100%);
      background: color-mix(in srgb, var(--panel) 86%, black);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 18px 18px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    header{
      display:flex;
      gap:14px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    h1{
      margin:0;
      font-size:20px;
      letter-spacing:.3px;
    }
    .sub{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }
    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    select, button{
      background: rgba(255,255,255,.06);
      color: var(--txt);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    button{
      cursor:pointer;
      transition: transform .08s ease, background .15s ease;
    }
    button:hover{ background: rgba(255,255,255,.09); }
    button:active{ transform: scale(.98); }
    .row{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      margin-top:10px;
      flex-wrap:wrap;
    }
    audio{
      width: 100%;
      margin-top: 12px;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    /* Emoji spectrum stage */
    .stage{
      margin-top:16px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 16px 12px 14px;
      overflow:hidden;
      position:relative;
    }
    .hint{
      position:absolute;
      top:10px;
      right:12px;
      color: rgba(255,255,255,.55);
      font-size:12px;
      user-select:none;
    }

    .emoji-bar{
      display:flex;
      gap: 8px;
      align-items:flex-end;
      justify-content:space-between;
      height: 160px;
      padding-top: 18px;
    }
    .dancer{
      width: 22px;
      height: 140px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      position:relative;
      transform: translateZ(0);
    }
    .dancer span{
      display:inline-block;
      font-size: 20px;
      line-height: 1;
      will-change: transform, filter;
      transform: translateY(0px) scale(1);
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.35));
    }

    /* Little baseline */
    .baseline{
      height:1px;
      background: rgba(255,255,255,.10);
      margin-top: 10px;
    }

    .footer{
      margin-top:12px;
      color: var(--muted);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .pill{
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.75);
    }
    a{ color: var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    @media (max-width:560px){
      .dancer{ width: 18px; }
      .dancer span{ font-size: 18px; }
      .emoji-bar{ height: 140px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>🎧 Anzel Music Lab</h1>
        <p class="sub">
          Pick a track, press play, and watch the emoji choir do audio-FFT aerobics.<br/>
          If your browser blocks autoplay, click <b>Enable Visualizer</b> once.
        </p>
      </div>

      <div class="controls">
        <select id="trackSelect" aria-label="Choose a track">
          <option value="Living.mp3">Living.mp3</option>
          <option value="FreqFlame.mp3">FreqFlame.mp3</option>
          <option value="Rise.mp3">Rise.mp3</option>
        </select>
        <button id="loadBtn">Load Track</button>
        <button id="enableBtn">Enable Visualizer</button>
      </div>
    </header>

    <audio id="player" controls preload="metadata" crossorigin="anonymous">
      <source id="src" src="Living.mp3" type="audio/mpeg" />
      Your browser can’t play this audio.
    </audio>

    <div class="stage" aria-label="Emoji spectrum analyser">
      <div class="hint">🕺📈 FFT vibes</div>
      <div id="emojiBar" class="emoji-bar"></div>
      <div class="baseline"></div>

      <div class="footer">
        <div class="pill" id="statusPill">Status: idle</div>
        <div class="pill">Folder: <code>/whispers/</code> (same directory as this file)</div>
      </div>
    </div>
  </div>

  <script>
    // ====== Configuration ======
    const EMOJIS = ["🕺","💃","🔥","✨","🦊","⚡","🌙","🎶","🪩","🌀","🧿","🫀"];
    const BARS = 40;                 // how many emoji "bins"
    const MAX_BOUNCE_PX = 110;       // jump height
    const SMOOTHING = 0.78;          // analyser smoothing (0..1)
    const FFT_SIZE = 2048;           // 1024/2048/4096 etc.

    // ====== Elements ======
    const player = document.getElementById("player");
    const srcEl = document.getElementById("src");
    const trackSelect = document.getElementById("trackSelect");
    const loadBtn = document.getElementById("loadBtn");
    const enableBtn = document.getElementById("enableBtn");
    const emojiBar = document.getElementById("emojiBar");
    const statusPill = document.getElementById("statusPill");

    // Build dancers
    const dancers = [];
    for(let i=0;i<BARS;i++){
      const d = document.createElement("div");
      d.className = "dancer";
      const s = document.createElement("span");
      s.textContent = EMOJIS[i % EMOJIS.length];
      d.appendChild(s);
      emojiBar.appendChild(d);
      dancers.push(s);
    }

    // ====== Audio Visualizer (Web Audio API) ======
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let freqData = null;
    let rafId = null;
    let enabled = false;

    function setStatus(msg){
      statusPill.textContent = "Status: " + msg;
    }

    function loadTrack(file){
      // assumes music.html is in the SAME folder as mp3s:
      // /whispers/music.html + /whispers/Living.mp3 etc.
      srcEl.src = file;
      player.load();
      setStatus("loaded " + file);
    }

    function ensureAudioGraph(){
      if(enabled) return;

      // Must be created from a user gesture (button click) in most browsers.
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = FFT_SIZE;
      analyser.smoothingTimeConstant = SMOOTHING;

      sourceNode = audioCtx.createMediaElementSource(player);

      // Route: player -> analyser -> speakers
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      freqData = new Uint8Array(analyser.frequencyBinCount);

      enabled = true;
      setStatus("visualizer enabled ✅");
      animate();
    }

    function animate(){
      if(!enabled) return;

      analyser.getByteFrequencyData(freqData);

      // Map the frequency bins into our emoji bars
      // We'll sample across the spectrum evenly.
      const binCount = freqData.length;
      for(let i=0;i<BARS;i++){
        const binIndex = Math.floor(i * binCount / BARS);

        // 0..255
        const v = freqData[binIndex];

        // Normalize and shape it a bit (so it feels punchy)
        const n = Math.pow(v / 255, 1.6);

        // Bounce height
        const y = -n * MAX_BOUNCE_PX;

        // Subtle size pulse
        const scale = 0.9 + n * 0.6;

        // Extra sparkle on highs (visual pop without neon vomit)
        const glow = 4 + n * 10;

        dancers[i].style.transform = `translateY(${y.toFixed(1)}px) scale(${scale.toFixed(3)})`;
        dancers[i].style.filter = `drop-shadow(0 ${glow.toFixed(1)}px ${glow.toFixed(1)}px rgba(0,0,0,.35))`;
      }

      rafId = requestAnimationFrame(animate);
    }

    // ====== Events ======
    loadBtn.addEventListener("click", () => {
      loadTrack(trackSelect.value);
    });

    enableBtn.addEventListener("click", async () => {
      ensureAudioGraph();
      if(audioCtx && audioCtx.state === "suspended"){
        await audioCtx.resume();
      }
    });

    player.addEventListener("play", async () => {
      // If user hits play before enabling, we try to enable on first play.
      // Some browsers still require the explicit button press; that's why the button exists.
      if(!enabled){
        try{
          ensureAudioGraph();
        }catch(e){
          setStatus("click Enable Visualizer (browser block)");
          return;
        }
      }
      if(audioCtx && audioCtx.state === "suspended"){
        await audioCtx.resume();
      }
      setStatus("playing ▶️");
    });

    player.addEventListener("pause", () => setStatus("paused ⏸️"));
    player.addEventListener("ended", () => setStatus("ended 🫡"));

    // Default
    loadTrack("Living.mp3");
  </script>
</body>
  </html>
